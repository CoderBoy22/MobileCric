<html lang="en">
<head>

<style>

<body>
<title>MobileCric</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#050f20">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Saira+Condensed:wght@600;700;800&display=swap">
<style>
/* Layout: mobile-first app shell; menus in a centred 560px column, match screen full-bleed stadium with overlay HUD */
:root {
  --navy-950: #050f20; --navy-900: #081a33; --navy-800: #0d2445; --navy-700: #163560; --navy-600: #1f4677;
  --green: #22b363; --green-600: #179450; --green-800: #0d6235; --turf: #2f8a48;
  --white: #f3f7f4; --muted: #9cb0c9; --faint: rgba(243,247,244,.08); --line: rgba(243,247,244,.12);
  --gold: #f5c518; --red: #ef4f55; --sky: #7ab6ff;
  --f-display: "Saira Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "Barlow", "Segoe UI", system-ui, sans-serif;
  --r: 14px; --r-sm: 9px;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--navy-950); color: var(--white); font-family: var(--f-body); font-size: 15px; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--navy-950); z-index: 50; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
input, select { font: inherit; color: var(--white); background: var(--navy-800); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 10px 12px; width: 100%; }
select option { background: var(--navy-800); }
.num { font-variant-numeric: tabular-nums; }
#app { height: 100%; position: relative; overflow: hidden; }
.screen { position: absolute; inset: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; animation: scrIn .28s ease both;
  background: radial-gradient(120% 70% at 50% -10%, #12335f 0%, var(--navy-900) 55%, var(--navy-950) 100%); }
@keyframes scrIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.wrap { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px 40px; display: flex; flex-direction: column; gap: 14px; }
.topbar { display: flex; align-items: center; gap: 10px; min-height: 44px; }
.topbar h1 { font-family: var(--f-display); font-weight: 800; font-size: 26px; letter-spacing: .02em; margin: 0; text-transform: uppercase; flex: 1; text-wrap: balance; }
.iconbtn { width: 42px; height: 42px; border-radius: 12px; border: 1px solid var(--line); background: var(--navy-800); display: grid; place-items: center; flex: none; }
.iconbtn svg { width: 20px; height: 20px; }
.label { font-family: var(--f-display); font-weight: 700; text-transform: uppercase; letter-spacing: .12em; font-size: 12px; color: var(--muted); margin: 4px 0 -4px; }
.card { background: linear-gradient(180deg, rgba(31,70,119,.45), rgba(13,36,69,.65)); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; }
.muted { color: var(--muted); }
.row { display: flex; gap: 10px; align-items: center; }
.row.wrapr { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 18px; border-radius: 12px; border: 1px solid var(--line); background: var(--navy-700);
  font-family: var(--f-display); font-weight: 700; font-size: 18px; letter-spacing: .06em; text-transform: uppercase; transition: transform .12s, background .2s, filter .2s; }
.btn:active { transform: scale(.97); }
.btn.primary { background: linear-gradient(180deg, #2bc46f, var(--green-600)); border-color: rgba(255,255,255,.25); color: #04210f; box-shadow: 0 6px 18px rgba(34,179,99,.3), inset 0 1px 0 rgba(255,255,255,.35); }
.btn.ghost { background: transparent; }
.btn.danger { background: rgba(239,79,85,.14); border-color: rgba(239,79,85,.5); color: #ffb3b6; }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--navy-800); font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; }
.chip.on { background: var(--white); color: var(--navy-900); border-color: var(--white); }
.chip small { opacity: .65; font-weight: 500; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: rgba(5,15,32,.7); border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 3px; }
.seg button { border: 0; background: transparent; border-radius: 9px; min-height: 40px; font-family: var(--f-display); font-weight: 700; letter-spacing: .05em; text-transform: uppercase; font-size: 15px; color: var(--muted); padding: 0 4px; }
.seg button.on { background: var(--white); color: var(--navy-900); }
.seg button small { display: block; font-size: 10px; letter-spacing: .08em; opacity: .7; margin-top: -2px; }

/* Home */
.home .wrap { gap: 18px; padding-top: 22px; }
.logo { display: flex; align-items: center; gap: 12px; }
.logo svg { width: 58px; height: 58px; flex: none; filter: drop-shadow(0 6px 14px rgba(0,0,0,.4)); }
.wordmark { font-family: var(--f-display); font-weight: 800; font-size: 40px; line-height: .9; letter-spacing: .01em; text-transform: uppercase; }
.wordmark span { color: var(--green); }
.tag { color: var(--muted); font-size: 13px; letter-spacing: .04em; margin-top: 4px; }
.hero { position: relative; border-radius: 18px; overflow: hidden; border: 1px solid var(--line); min-height: 168px; padding: 18px; display: flex; flex-direction: column; justify-content: flex-end; gap: 10px;
  background: linear-gradient(180deg, rgba(8,26,51,0) 30%, rgba(8,26,51,.92)), repeating-linear-gradient(180deg, #2f8a48 0 22px, #2a7f42 22px 44px); }
.hero .pitchstrip { position: absolute; left: 50%; top: -20px; width: 64px; height: 150%; transform: translateX(-50%) perspective(200px) rotateX(42deg); background: linear-gradient(#d2bd85, #bea56a); opacity: .8; }
.hero h2 { position: relative; font-family: var(--f-display); font-size: 30px; line-height: 1; margin: 0; text-transform: uppercase; font-weight: 800; }
.hero p { position: relative; margin: 0; color: #d7e4f3; font-size: 14px; }
.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.mode { text-align: left; border: 1px solid var(--line); border-radius: var(--r); background: var(--navy-800); padding: 14px; display: flex; flex-direction: column; gap: 6px; min-height: 104px; transition: transform .12s, border-color .2s; }
.mode:active { transform: scale(.98); }
.mode:hover { border-color: rgba(255,255,255,.3); }
.mode b { font-family: var(--f-display); font-size: 20px; text-transform: uppercase; letter-spacing: .03em; }
.mode span { color: var(--muted); font-size: 13px; line-height: 1.3; }
.mode .ic { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; background: rgba(34,179,99,.16); color: var(--green); }
.mode .ic svg { width: 18px; height: 18px; }
.mode.wide { grid-column: span 2; flex-direction: row; align-items: center; min-height: 0; }
.resume { border-color: rgba(245,197,24,.45); background: linear-gradient(90deg, rgba(245,197,24,.12), var(--navy-800)); }

/* Team badges */
.badge { --c: #555; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; flex: none; font-family: var(--f-display); font-weight: 800; font-size: 13px; letter-spacing: .02em;
  background: radial-gradient(circle at 30% 25%, rgba(255,255,255,.35), transparent 50%), var(--c); color: #fff; border: 2px solid rgba(255,255,255,.85); text-shadow: 0 1px 2px rgba(0,0,0,.5); }
.badge.lg { width: 64px; height: 64px; font-size: 20px; border-width: 3px; }
.badge.sm { width: 28px; height: 28px; font-size: 10px; border-width: 1.5px; }
.teamgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
.tpick { border: 1px solid var(--line); background: var(--navy-800); border-radius: 12px; padding: 10px 6px; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; min-width: 0; }
.tpick small { color: var(--muted); font-weight: 500; font-size: 11px; }
.tpick.on { border-color: var(--green); background: rgba(34,179,99,.14); box-shadow: inset 0 0 0 1px var(--green); }
.tpick.dis { opacity: .35; pointer-events: none; }
.vs { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; text-align: center; }
.vs .side { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; }
.vs .side b { font-family: var(--f-display); font-size: 20px; text-transform: uppercase; }
.vs .v { font-family: var(--f-display); font-weight: 800; color: var(--muted); font-size: 22px; }

/* Toss */
.toss { display: flex; flex-direction: column; align-items: center; gap: 22px; text-align: center; padding-top: 10px; }
.coinstage { perspective: 800px; height: 220px; display: grid; place-items: center; width: 100%; }
.coin { width: 130px; height: 130px; position: relative; transform-style: preserve-3d; }
.coin .face { position: absolute; inset: 0; border-radius: 50%; display: grid; place-items: center; backface-visibility: hidden; font-family: var(--f-display); font-weight: 800; font-size: 22px; letter-spacing: .05em; color: #5a3d00;
  background: radial-gradient(circle at 35% 30%, #fff1b0, #f2c44b 45%, #b8860b 100%); border: 5px solid #d9a521; box-shadow: inset 0 0 0 6px rgba(255,255,255,.25), inset 0 0 0 10px rgba(150,100,0,.35); }
.coin .tails { transform: rotateY(180deg); }
.coin.flip { animation: coinFlip 1.9s cubic-bezier(.2,.7,.3,1) forwards; }
@keyframes coinFlip { 0% { transform: translateY(0) rotateY(0); } 45% { transform: translateY(-120px) rotateY(calc(var(--turns) * .5)); } 100% { transform: translateY(0) rotateY(var(--turns)); } }
.tossmsg { font-family: var(--f-display); font-size: 28px; font-weight: 800; text-transform: uppercase; min-height: 34px; }

/* Game screen */
.game { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--navy-950); overflow: hidden; }
.stage { position: relative; flex: 1; min-height: 0; overflow: hidden; touch-action: manipulation; }
.stage canvas { display: block; position: absolute; inset: 0; }
.hud { position: absolute; top: 0; left: 0; right: 0; padding: 8px max(10px, env(safe-area-inset-right, 0px)) 0 max(10px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 6px; pointer-events: none; z-index: 3; }
.sb { pointer-events: auto; display: flex; width: 100%; max-width: 760px; align-items: stretch; border-radius: 12px; overflow: hidden; background: rgba(5,15,32,.88); border: 1px solid rgba(255,255,255,.14); box-shadow: 0 8px 24px rgba(0,0,0,.35); backdrop-filter: blur(6px); }
.sb .teamtag { display: flex; align-items: center; gap: 8px; padding: 6px 10px; background: var(--tc, var(--green-800)); font-family: var(--f-display); font-weight: 800; font-size: 18px; letter-spacing: .04em; }
.sb .score { display: flex; align-items: baseline; gap: 8px; padding: 4px 12px; font-family: var(--f-display); }
.sb .score b { font-size: 30px; font-weight: 800; line-height: 1; }
.sb .score .ov { font-size: 17px; color: var(--muted); font-weight: 600; }
.sb .meta { margin-left: auto; padding: 4px 10px; display: flex; flex-direction: column; justify-content: center; align-items: flex-end; font-size: 12px; line-height: 1.25; color: var(--muted); text-align: right; min-width: 0; }
.sb .meta strong { color: var(--white); font-weight: 700; }
.pulse { animation: pulse .5s ease; }
@keyframes pulse { 0% { transform: scale(1); } 40% { transform: scale(1.18); color: var(--gold); } 100% { transform: scale(1); } }
.sub { pointer-events: auto; max-width: 760px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.pill { background: rgba(5,15,32,.82); border: 1px solid rgba(255,255,255,.12); border-radius: 9px; padding: 4px 9px; font-size: 12.5px; display: inline-flex; gap: 6px; align-items: center; white-space: nowrap; }
.pill b { font-weight: 700; }
.pill .st { color: var(--gold); }
.balls { display: inline-flex; gap: 4px; }
.bc { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 700; background: rgba(255,255,255,.14); font-family: var(--f-display); }
.bc.r4 { background: #fff; color: var(--navy-900); }
.bc.r6 { background: var(--gold); color: #3a2c00; }
.bc.w { background: var(--red); }
.bc.x { background: #4a6a9b; font-size: 9px; }
.bc.d { color: var(--muted); }
.need { pointer-events: auto; align-self: center; background: rgba(245,197,24,.95); color: #2a1f00; border-radius: 999px; padding: 4px 14px; font-weight: 700; font-size: 13px; }
.fh { background: var(--red); color: #fff; }
.corner { position: absolute; z-index: 4; display: flex; gap: 8px; }
.corner.bl { left: max(10px, env(safe-area-inset-left, 0px)); bottom: 10px; }
.corner .iconbtn { background: rgba(5,15,32,.75); }
.banner { position: absolute; left: 0; right: 0; top: 38%; display: grid; place-items: center; pointer-events: none; z-index: 5; }
.banner .bt { font-family: var(--f-display); font-weight: 800; text-transform: uppercase; font-size: clamp(64px, 18vw, 140px); line-height: .85; letter-spacing: .02em; text-align: center; animation: bIn .9s cubic-bezier(.2,1.4,.4,1) both; text-shadow: 0 6px 0 rgba(0,0,0,.25), 0 10px 30px rgba(0,0,0,.5); }
.banner .bt small { display: block; font-size: .28em; letter-spacing: .14em; margin-top: 8px; color: var(--white); text-shadow: 0 2px 8px rgba(0,0,0,.6); }
.bt.four { color: #fff; -webkit-text-stroke: 2px var(--turf); }
.bt.six { color: var(--gold); -webkit-text-stroke: 2px #6b4c00; }
.bt.out { color: var(--red); -webkit-text-stroke: 2px #4a0a0d; }
.bt.info { color: #fff; font-size: clamp(38px, 10vw, 74px); -webkit-text-stroke: 1px rgba(0,0,0,.4); }
.bt.gone { animation: bOut .35s ease forwards; }
@keyframes bIn { 0% { opacity: 0; transform: scale(.3) rotate(-6deg); } 60% { opacity: 1; } 100% { opacity: 1; transform: none; } }
@keyframes bOut { to { opacity: 0; transform: scale(1.2); } }
.timing { position: absolute; left: 50%; transform: translateX(-50%); bottom: 78px; z-index: 4; display: flex; flex-direction: column; align-items: center; gap: 5px; pointer-events: none; animation: fade .2s ease both; }
.timing .tl { font-family: var(--f-display); font-weight: 800; letter-spacing: .1em; font-size: 18px; padding: 2px 12px; border-radius: 8px; background: rgba(5,15,32,.85); }
.tbar { position: relative; width: 210px; height: 10px; border-radius: 6px; background: linear-gradient(90deg, #8c2a2e 0%, #c9772c 18%, #d9c24a 32%, #2bc46f 44%, #8ef0b6 50%, #2bc46f 56%, #d9c24a 68%, #c9772c 82%, #8c2a2e 100%); border: 1px solid rgba(255,255,255,.4); }
.tbar i { position: absolute; top: -5px; width: 4px; height: 20px; border-radius: 2px; background: #fff; box-shadow: 0 0 0 1px #000; transform: translateX(-2px); }
.tbar span { position: absolute; top: 12px; font-size: 10px; color: var(--muted); letter-spacing: .1em; }
.speedgun { position: absolute; right: max(12px, env(safe-area-inset-right, 0px)); bottom: 12px; z-index: 4; font-family: var(--f-display); text-align: right; pointer-events: none; animation: scrIn .2s ease both; background: rgba(5,15,32,.8); border-radius: 10px; padding: 4px 10px; border: 1px solid var(--line); }
.speedgun b { font-size: 20px; display: block; line-height: 1; }
.speedgun span { font-size: 11px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
.tray { flex: none; background: linear-gradient(180deg, var(--navy-900), var(--navy-950)); border-top: 1px solid var(--line); padding: 10px max(12px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 8px; z-index: 6; }
.tray .inner { width: 100%; max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
.tray .lbl { font-size: 10.5px; font-family: var(--f-display); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-bottom: -4px; }
.playbtn { min-height: 58px; font-size: 24px; }
.trayrow { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.meter { position: relative; height: 44px; border-radius: 12px; background: rgba(5,15,32,.9); border: 1px solid var(--line); overflow: hidden; }
.meter .zone { position: absolute; top: 0; bottom: 0; left: 50%; background: linear-gradient(90deg, transparent, rgba(34,179,99,.55), transparent); transform: translateX(-50%); }
.meter .core { position: absolute; top: 0; bottom: 0; left: 50%; width: 3px; background: var(--green); transform: translateX(-50%); }
.meter .mk { position: absolute; top: 4px; bottom: 4px; width: 8px; border-radius: 4px; background: #fff; box-shadow: 0 0 12px rgba(255,255,255,.8); transform: translateX(-4px); }
.meter .mt { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--f-display); font-weight: 700; letter-spacing: .12em; font-size: 13px; color: var(--muted); pointer-events: none; text-transform: uppercase; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 90; background: var(--white); color: var(--navy-900); padding: 10px 16px; border-radius: 12px; font-weight: 600; box-shadow: 0 10px 30px rgba(0,0,0,.4); animation: scrIn .2s ease both; max-width: calc(100% - 32px); text-align: center; }
.chipnote { position: absolute; left: 50%; top: 30%; transform: translateX(-50%); z-index: 5; pointer-events: none; background: rgba(5,15,32,.9); border: 1px solid var(--line); border-radius: 12px; padding: 8px 16px; text-align: center; animation: fade .25s ease both; }
.chipnote b { font-family: var(--f-display); font-size: 20px; text-transform: uppercase; letter-spacing: .05em; display: block; }
.chipnote span { color: var(--muted); font-size: 13px; }

/* Modal */
.modal { position: fixed; inset: 0; z-index: 80; background: rgba(2,8,18,.7); display: flex; align-items: flex-end; justify-content: center; animation: fade .2s ease both; backdrop-filter: blur(3px); }
@keyframes fade { from { opacity: 0; } }
.sheet { width: 100%; max-width: 560px; max-height: 88%; overflow-y: auto; background: var(--navy-900); border: 1px solid var(--line); border-radius: 20px 20px 0 0; padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 12px; animation: up .28s cubic-bezier(.2,.9,.3,1) both; }
@keyframes up { from { transform: translateY(40px); opacity: 0; } }
@media (min-width: 700px) { .modal { align-items: center; } .sheet { border-radius: 20px; } }
.sheet h2 { font-family: var(--f-display); text-transform: uppercase; font-size: 24px; margin: 0; letter-spacing: .03em; }
.blist { display: flex; flex-direction: column; gap: 8px; }
.bopt { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; text-align: left; border: 1px solid var(--line); background: var(--navy-800); border-radius: 12px; padding: 10px 12px; align-items: center; }
.bopt b { font-size: 15px; }
.bopt .typ { font-size: 11px; font-family: var(--f-display); letter-spacing: .1em; text-transform: uppercase; padding: 2px 8px; border-radius: 6px; background: rgba(255,255,255,.1); justify-self: end; }
.bopt .fig { color: var(--muted); font-size: 12.5px; grid-column: span 2; }
.bopt[disabled] { opacity: .38; }
.typ.fast { background: rgba(239,79,85,.25); color: #ffc2c4; } .typ.medium { background: rgba(122,182,255,.22); color: #cfe4ff; } .typ.spin { background: rgba(245,197,24,.2); color: #ffe89a; }

/* Scorecard */
.tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.tabs button { flex: none; border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 8px 14px; font-weight: 600; font-size: 14px; }
.tabs button.on { background: var(--white); color: var(--navy-900); }
.tblwrap { overflow-x: auto; border-radius: 12px; border: 1px solid var(--line); }
table.sc { width: 100%; border-collapse: collapse; font-size: 13.5px; font-variant-numeric: tabular-nums; min-width: 340px; }
.sc th { text-align: right; font-weight: 600; color: var(--muted); font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; padding: 8px 8px; background: rgba(255,255,255,.04); }
.sc th:first-child, .sc td:first-child { text-align: left; }
.sc td { text-align: right; padding: 7px 8px; border-top: 1px solid var(--line); }
.sc td .how { display: block; color: var(--muted); font-size: 12px; }
.sc tr.no td:first-child b { color: var(--green); }
.sc td.r b { font-size: 15px; }

const PITCHES = { balanced: 'Balanced', flat: 'Flat road', green: 'Green seamer', turner: 'Dusty turner' };

function condMods(cond, bowlType, innNo) {

    case 'green': if (pace) { w *= 1.3; b *= 0.92; } else w *= 0.95; break;
    case 'turner': if (spin) { w *= 1.35; b *= 0.9; } else w *= 0.95; break;

  switch (cond.weather) {
    case 'overcast': if (pace) w *= 1.15; break;
    case 'sunny': b *= 1.03; break;

// Short formats: 2 overs (or less) = 5 wickets, up to 5 overs = 7 wickets, otherwise 10
const wicketsFor = maxBalls => maxBalls <= 12 ? 5 : maxBalls <= 30 ? 7 : 10;
const ptype = p => (p && BOWL_STYLES[p.bowlStyle]) || 'none';

function xiOf(team) {
  const byId = {}; team.players.forEach(p => byId[p.id] = p);
  const xi = (team.xi || []).map(id => byId[id]).filter(Boolean);
  if (xi.length < 11) {
    const rest = team.players.filter(p => !xi.includes(p)).sort((a, b) => overall(b) - overall(a));
    while (xi.length < 11 && rest.length) xi.push(rest.shift());

  return xi.slice(0, 11);
}

  const xi = xiOf(team); if (!xi.length) return { bat: 0, bowl: 0, ovr: 0 };
  const bat = xi.slice(0, 7).reduce((s, p) => s + p.bat, 0) / Math.min(7, xi.length);
  const bowlers = xi.slice().sort((a, b) => b.bowl - a.bowl).slice(0, 5);
  const bowl = bowlers.reduce((s, p) => s + p.bowl, 0) / bowlers.length;
  return { bat: Math.round(bat), bowl: Math.round(bowl), ovr: Math.round((bat + bowl) / 2) };
}

// ---------- Innings ----------
function newInnings(batTeam, bowlTeam, maxBalls, o = {}) {
  const batXI = xiOf(batTeam), bowlXI = xiOf(bowlTeam);

  const lineup = o.superOver ? batXI.slice().sort((a, b) => b.bat - a.bat).slice(0, 3).map(p => p.id) : batXI.map(p => p.id);
  const inn = {
    batId: batTeam.id, bowlId: bowlTeam.id, batName: batTeam.name, bowlName: bowlTeam.name, batShort: batTeam.short, bowlShort: bowlTeam.short,
    batColor: batTeam.color, bowlColor: bowlTeam.color,
    players, lineup, fielders: bowlXI.map(p => p.id), maxBalls, maxWkts: o.maxWkts != null ? o.maxWkts : Math.min(wicketsFor(maxBalls), lineup.length - 1),
    target: o.target || null, num: o.num || 1, superOver: !!o.superOver, cond: o.cond || {},
    runs: 0, wkts: 0, balls: 0, extras: { w: 0, nb: 0, b: 0, lb: 0 }, bat: {}, order: [], striker: null, non: null, next: 2,
    bowlers: {}, bOrder: [], cur: null, lastOver: null, overCharged: 0, overBalls: [], overs: [], fow: [], recent: [],
    freeHit: false, done: false, f4: 0, s6: 0, form: gauss() * (maxBalls > 120 ? 0.045 : 0.065), worm: [], lastPlan: []
  };

  inn.striker = lineup[0]; inn.non = lineup[1];
  return inn;
}
function addBatter(inn, id) {
  inn.bat[id] = { id, r: 0, b: 0, f4: 0, s6: 0, out: false, how: '', bowler: '', fielder: '' };
  inn.order.push(id);
}
function setBowler(inn, id) {
  if (!inn.bowlers[id]) { inn.bowlers[id] = { id, balls: 0, runs: 0, wkts: 0, maidens: 0, wd: 0, nb: 0 }; inn.bOrder.push(id); }
  inn.cur = id; inn.overCharged = 0; inn.overBalls = [];
}
function bowlerQuota(inn) { return inn.superOver ? 1 : Math.max(1, Math.ceil(Math.ceil(inn.maxBalls / 6) / 5)); }

  const q = bowlerQuota(inn) * 6;

}
function chooseBowler(inn) {
  const p = inn.balls / inn.maxBalls;

  if (!cands.length) cands = eligibleBowlers(inn);
  if (!cands.length) cands = inn.fielders.filter(id => id !== inn.lastOver);
  if (!cands.length) cands = inn.fielders.slice();

  for (const id of cands) {
    const pl = inn.players[id], t = ptype(pl), used = inn.bowlers[id] ? inn.bowlers[id].balls : 0;
    let s = pl.bowl + rnd() * 14;
    if ((p < 0.25 || p > 0.75) && t === 'fast') s += 8;
    if (p >= 0.25 && p <= 0.75 && t === 'spin') s += 8;
    if (t === 'none') s -= 30;
    // save top bowlers for the death in long formats
    if (p < 0.6 && oversLeft > 4 && pl.bowl >= 85 && used >= quota - 12) s -= 6;
    if (inn.bowlers[id]) { const bw = inn.bowlers[id]; if (bw.balls >= 12 && bw.runs / bw.balls * 6 > 11) s -= 10; }
    if (s > bs) { bs = s; best = id; }
  }

}

// r: {kind:'legal'|'wide'|'nb', runs, ext, extKind, wideRuns, wicket:{how, fielder}}
function applyBall(inn, r) {

  const bw = inn.bowlers[inn.cur], st = inn.bat[inn.striker];

    const t = 1 + (r.wideRuns || 0);

    ev.code = 'Wd' + (t > 1 ? '+' + (t - 1) : ''); ran = r.wideRuns || 0;
  } else if (r.kind === 'nb') {
    const br = r.runs || 0;

    st.r += br; st.b++; ev.total = 1 + br;
    if (br === 4) { st.f4++; inn.f4++; ev.boundary = 4; } else if (br === 6) { st.s6++; inn.s6++; ev.boundary = 6; } else ran = br;
    ev.code = 'Nb' + (br ? '+' + br : '');

    inn.balls++; bw.balls++; st.b++;

    } else {
      const br = r.runs || 0;
      inn.runs += br; st.r += br; bw.runs += br; inn.overCharged += br; ev.total = br;
      if (br === 4) { st.f4++; inn.f4++; ev.boundary = 4; } else if (br === 6) { st.s6++; inn.s6++; ev.boundary = 6; } else ran = br;
      ev.code = String(br);

  let w = r.wicket;
  if (w && r.kind === 'wide') w = null;
  if (w && (r.kind === 'nb' || inn.freeHit) && w.how !== 'run out') w = null;
  if (w) {
    const outId = w.non ? inn.non : inn.striker, ob = inn.bat[outId];
    ob.out = true; ob.how = w.how; ob.bowler = inn.cur; ob.fielder = w.fielder || '';
    inn.wkts++; if (w.how !== 'run out') bw.wkts++;
    inn.fow.push({ w: inn.wkts, runs: inn.runs, over: oversFull(inn.balls), id: outId });
    ev.wicket = true; ev.outId = outId; ev.how = w.how; ev.code = r.kind === 'legal' ? 'W' : ev.code + 'W';
    if (inn.wkts < inn.maxWkts && inn.next < inn.lineup.length) {
      const nid = inn.lineup[inn.next++]; addBatter(inn, nid);
      if (outId === inn.striker) inn.striker = nid; else inn.non = nid;
    } else { if (outId === inn.striker) inn.striker = null; else inn.non = null; }
  }
  if (ran % 2 === 1 && inn.striker && inn.non) { const t = inn.striker; inn.striker = inn.non; inn.non = t; }
  if (r.kind === 'nb') { inn.freeHit = true; ev.freeHitNext = true; } else if (r.kind === 'legal') inn.freeHit = false;
  inn.overBalls.push(ev.code); inn.recent.push(ev.code); if (inn.recent.length > 18) inn.recent.shift();

    ev.overDone = true;

    inn.lastOver = inn.cur; inn.cur = null;
  }
  if (inn.wkts >= inn.maxWkts || inn.balls >= inn.maxBalls || (inn.target && inn.runs >= inn.target)) {
    inn.done = true;
    if (!ev.overDone && inn.balls % 6) { inn.overs.push({ no: Math.ceil(inn.balls / 6), bowler: inn.cur, runs: inn.runs - (inn.overs.length ? inn.overs[inn.overs.length - 1].total : 0), total: inn.runs, wkts: inn.wkts, balls: inn.overBalls.slice(), partial: true }); inn.worm.push(inn.runs); }
  }
  return ev;
}

// ---------- AI scoring model ----------
//            W      0      1      2      3      4      6
const CAUT = [0.0125, 0.52, 0.337, 0.063, 0.006, 0.047, 0.011];
const AGGR = [0.072, 0.282, 0.302, 0.088, 0.006, 0.142, 0.102];
const RUNS = [0, 0, 1, 2, 3, 4, 6];
const erOf = a => { let s = 0; for (let i = 1; i < 7; i++) s += RUNS[i] * (CAUT[i] * (1 - a) + AGGR[i] * a); return s; };

function aggression(inn) {
  const O = inn.maxBalls / 6;
  let a = O <= 1 ? 0.88 : O <= 2 ? 0.78 : O <= 5 ? 0.66 : O <= 10 ? 0.52 : O <= 20 ? 0.55 - (O - 10) / 10 * 0.11 : 0.40 - (Math.min(O, 50) - 20) / 30 * 0.23;
  const p = inn.balls / inn.maxBalls, wl = inn.maxWkts - inn.wkts;
  if (p < 0.2) a += 0.05;
  if (p > 0.72) a += 0.5 * (p - 0.72) / 0.28;
  if (wl <= Math.ceil(inn.maxWkts * 0.3) && p < 0.85) a -= 0.12;
  if (wl >= inn.maxWkts * 0.7 && p > 0.6) a += 0.08;
  if (inn.target) {
    const need = inn.target - inn.runs, left = inn.maxBalls - inn.balls;
    if (left > 0) a += clamp((need / left - erOf(clamp(a, 0, 1))) * 0.9, -0.3, 0.55);
  }
  return clamp(a, 0.04, 0.98);
}
function sampleIdx(p) { let s = p.reduce((a, b) => a + b, 0), x = rnd() * s; for (let i = 0; i < p.length; i++) { x -= p[i]; if (x <= 0) return i; } return p.length - 1; }

function coreOutcomeProbs(inn, m) {
  const batter = inn.players[inn.striker], bowler = inn.players[inn.cur];
  const a = clamp(aggression(inn) + (m.aggr || 0), 0.03, 0.99);
  const p = CAUT.map((c, i) => c * (1 - a) + AGGR[i] * a);
  const d = (batter.bat - bowler.bowl) / 100 + inn.form + setBonus(inn.bat[inn.striker]) + (m.d || 0);
  const cm = condMods(inn.cond, ptype(bowler), inn.num);
  p[0] *= Math.exp(-1.85 * d) * (m.w || 1) * cm.w;
  p[5] *= Math.exp(1.25 * d) * (m.b || 1) * cm.b;
  p[6] *= Math.exp(1.35 * d) * (m.b || 1) * (m.six || 1) * cm.b;
  p[1] *= Math.exp(-0.5 * d);
  return { p, a };
}

function pickFielder(inn, how) {
  const wk = inn.fielders.find(id => inn.players[id].wk);
  if ((how === 'caught behind' || how === 'stumped') && wk) return wk;
  if (how === 'c&b') return inn.cur;
  const f = inn.fielders.filter(id => id !== inn.cur && id !== wk);
  return pick(f.length ? f : inn.fielders);
}
function dismissalFor(inn, hint) {
  const t = ptype(inn.players[inn.cur]);
  let how;
  if (hint) how = wpick(hint);
  else if (t === 'spin') how = wpick({ caught: 44, 'caught behind': 6, bowled: 17, lbw: 20, stumped: 7, 'run out': 4, 'c&b': 2 });
  else how = wpick({ caught: 34, 'caught behind': 18, bowled: 20, lbw: 18, 'run out': 7, 'c&b': 3 });
  if (how === 'stumped' && t !== 'spin') how = 'caught behind';
  return { how, fielder: (how === 'bowled' || how === 'lbw') ? '' : pickFielder(inn, how) };
}

// Fill metadata for visuals (field angle in degrees: 0 = straight, + = off side, dist: 1 = boundary)
function shotMeta(runs, wicket, how, dir, line, timingSign) {
  let ang;

  else ang = line === 'leg' || line === 'wideLeg' ? rr(-120, -25) : line === 'middle' ? rr(-60, 30) : rr(15, 110);
  if (timingSign < 0) ang -= 25; if (timingSign > 0) ang += 30;
  if (rnd() < 0.12 && runs > 0 && runs < 6) ang = rnd() < 0.5 ? rr(130, 170) : rr(-170, -130);

  let aerial = runs === 6;
  if (wicket && (how === 'caught' || how === 'c&b')) { dist = how === 'c&b' ? 0.18 : rr(0.55, 0.92); aerial = true; }
  if (wicket && how === 'caught behind') { ang = rr(160, 178) * (rnd() < 0.5 ? 1 : 1); dist = 0.12; aerial = true; }
  if (wicket && how === 'run out') dist = rr(0.3, 0.5);
  return { ang: ((ang + 540) % 360) - 180, dist, aerial };
}

function simBall(inn, m = {}) {
  if (!inn.cur) setBowler(inn, chooseBowler(inn));
  const bowler = inn.players[inn.cur];
  const ef = (1 + (75 - bowler.bowl) / 70) * (m.extra || 1);
  if (rnd() < 0.018 * ef) {
    const wr = rnd() < 0.08 ? 4 : 0;
    return { kind: 'wide', wideRuns: wr, meta: { ang: rr(90, 170), dist: wr ? 1 : 0.1 } };
  }
  const nb = rnd() < 0.006 * ef;
  const { p } = coreOutcomeProbs(inn, m);
  const i = sampleIdx(p);
  const r = { kind: nb ? 'nb' : 'legal', runs: RUNS[i] };
  if (i === 0) {
    r.wicket = dismissalFor(inn, m.hint);
    if (r.wicket.how === 'run out' && rnd() < 0.4) r.runs = 1;
  }
  if (!nb && i === 1 && rnd() < 0.055) { r.ext = 1; r.extKind = rnd() < 0.8 ? 'lb' : 'b'; r.runs = 0; }
  r.meta = shotMeta(r.runs, !!r.wicket, r.wicket && r.wicket.how, 'auto', pick(['off', 'off', 'middle', 'leg']), 0);
  return r;
}

function simulateInnings(inn, m, onBall) {
  let guard = 0;
  while (!inn.done && guard++ < 6000) {
    const r = simBall(inn, m); const ev = applyBall(inn, r);
    if (onBall) onBall(r, ev);
  }
  return inn;
}

// ===== MATCH FLOW, PLAY SCREEN, TOURNAMENTS, SIMULATOR =====
const Game = {
  m: null,
  start(o) {
    const snap = id => JSON.parse(JSON.stringify(APP.team(id)));
    this.m = { id: 'M' + Date.now(), user: snap(o.user), opp: snap(o.opp), userId: o.user, oppId: o.opp, overs: +o.overs, diff: o.diff || APP.state.settings.diff,
      cond: { pitch: o.pitch || 'balanced', weather: o.weather || 'sunny' }, oppMode: o.oppMode || 'bowl', tour: o.tour || null, innings: [], so: [], toss: null, created: Date.now() };
    APP.go('toss');
  },
  team(id) { return id === this.m.userId ? this.m.user : this.m.opp; },
  other(id) { return id === this.m.userId ? this.m.oppId : this.m.userId; },
  ctx(inn) { const D = DIFF[this.m.diff]; return inn.batId === this.m.userId ? { w: D.simW, b: D.simB } : { w: D.oppW, b: D.oppB, d: D.oppD }; },
  slow() { return DIFF[this.m.diff].slow * ({ slow: 1.22, normal: 1, fast: 0.84 }[APP.state.settings.ballSpeed] || 1); },
  afterToss(batFirstId) { this.m.batFirst = batFirstId; this.begin(0); },
  begin(k) {
    const m = this.m, bf = this.team(m.batFirst), bs = this.team(this.other(m.batFirst));
    const inn = newInnings(k === 0 ? bf : bs, k === 0 ? bs : bf, m.overs * 6, { num: k + 1, target: k === 1 ? m.innings[0].runs + 1 : null, cond: m.cond });
    m.innings[k] = inn; this.route(inn);
  },
  route(inn) { this.inn = inn; if (inn.batId === this.m.userId || this.m.oppMode === 'bowl') APP.go('game'); else APP.go('simview'); },
  inningsDone(inn) {
    if (inn.superOver) { if (this.m.so.length % 2 === 1) this.startSO(); else this.finishOrSO(); return; }
    if (inn.num === 1) APP.go('break'); else this.finishOrSO();
  },
  finishOrSO() { const m = this.m, res = resultOf(m.innings[0], m.innings[1], m.so); if (res.pendingSO) return this.startSO(); this.finish(res); },
  startSO() {
    const m = this.m, k = m.so.length, first = m.innings[1].batId, batId = k % 2 === 0 ? first : this.other(first), prev = k % 2 === 1 ? m.so[k - 1] : null;
    const inn = newInnings(this.team(batId), this.team(this.other(batId)), 6, { superOver: true, maxWkts: 2, cond: m.cond, target: prev ? prev.runs + 1 : null, num: 3 + k });
    m.so.push(inn); this.inn = inn; APP.go('break', { so: true });
  },
  finish(res) {
    const m = this.m, all = m.innings.concat(m.so);
    m.result = res; m.potm = playerOfMatch(all, res.winnerId); m.top = topScorer(m.innings); m.best = bestBowling(m.innings);
    const st = APP.state.stats; st.played++;
    if (res.winnerId === m.userId) st.won++; else if (!res.winnerId) st.tied++; else st.lost++;
    m.innings.forEach(inn => {
      if (inn.batId === m.userId) {
        st.runs += inn.runs; st.balls += inn.balls; st.outs += inn.wkts; st.f4 += inn.f4; st.s6 += inn.s6;
        inn.order.forEach(id => { const b = inn.bat[id]; if (!st.hs || b.r > st.hs.r || (b.r === st.hs.r && b.b < st.hs.b)) st.hs = { r: b.r, b: b.b, no: !b.out, name: inn.players[id].name, vs: m.opp.name }; });
      } else {
        inn.bOrder.forEach(id => { const b = inn.bowlers[id]; st.wkts += b.wkts; if (b.balls && (!st.bb || b.wkts > st.bb.w || (b.wkts === st.bb.w && b.runs < st.bb.r))) st.bb = { w: b.wkts, r: b.runs, name: inn.players[id].name, vs: m.opp.name }; });
      }
    });
    APP.state.history.unshift({ id: m.id, date: Date.now(), userId: m.userId, userShort: m.user.short, userColor: m.user.color, title: `${m.user.short} v ${m.opp.short} · ${m.overs} ov`, text: res.text,
      res: res.winnerId === m.userId ? 'W' : res.winnerId ? 'L' : 'T', potm: m.potm ? m.potm.name : '', innings: all.map(strip) });
    APP.state.history = APP.state.history.slice(0, 30);
    if (m.tour) {
      const t = APP.state.tournament, f = t && t.fixtures.find(x => x.id === m.tour.fid);
      if (f && !f.result) { recordFixture(t, f, summarize(m.innings[0], m.innings[1], res)); if (t.done && t.winner === t.user && !t.counted) { st.tours++; t.counted = true; } }
    }
    APP.save(); APP.go('result');
  }
};

const SHOTS = [['defend', 'Defend', 'safe'], ['normal', 'Normal', 'balanced'], ['attack', 'Attack', 'risky'], ['loft', 'Loft', 'all-in']];
Screens.game = {

// ---------- SIM RUNNER (shared) ----------
function SimRunner(root, inn, ctx, opts = {}) {
  const R = { speed: opts.speed || 1, paused: false, timer: null, shots: [], done: false, stopped: false };
  const bt = opts.teams || {};
  root.innerHTML = `<div class="simgrid">
    <div class="card simboard"><span class="badge lg" style="--c:${esc(inn.batColor)}">${esc(inn.batShort)}</span><div class="grow"><div class="muted" style="font-size:13px">${esc(inn.batName)} v ${esc(inn.bowlName)}</div><div class="big num" id="sr-score"></div></div></div>
    <div class="kv"><div><span>Run rate</span><b id="sr-rr"></b></div><div><span>Extras</span><b id="sr-ex"></b></div><div><span>4s / 6s</span><b id="sr-bd"></b></div><div><span id="sr-kl"></span><b id="sr-kv"></b></div></div>
    <div class="card" style="display:flex;flex-direction:column;gap:8px"><div class="sub" id="sr-who"></div><div class="row"><span class="label" style="margin:0">This over</span><span class="balls" id="sr-over"></span></div></div>
    <div class="row"><div class="seg grow" id="sr-spd"><button data-sp="1">1x</button><button data-sp="4">4x</button><button data-sp="20">20x</button></div><button class="iconbtn" id="sr-pp" aria-label="Pause">${ICON.pause}</button><button class="btn" id="sr-skip">${ICON.ff} Skip</button></div>
    <div class="card"><div class="label" style="margin:0 0 6px">Runs by over</div><canvas class="worm" id="sr-worm"></canvas></div>
    <div class="trayrow"><div class="card"><div class="label" style="margin:0 0 6px">Wagon wheel</div><canvas class="wagon" id="sr-wag"></canvas><div class="legend"><span><i style="background:#bfe8cc"></i>1-3</span><span><i style="background:#fff"></i>4</span><span><i style="background:#f5c518"></i>6</span></div></div>
    <div class="card"><div class="label" style="margin:0 0 6px">Overs</div><div class="overstrip" id="sr-overs"></div></div></div></div>`;
  const q = s => root.querySelector(s);
  const ballChip = c => { const cls = c === 'W' || /W$/.test(c) ? 'w' : c === '4' || /\+4$/.test(c) ? 'r4' : c === '6' || /\+6$/.test(c) ? 'r6' : /Wd|Nb|lb|b$/.test(c) ? 'x' : c === '0' ? 'd' : ''; return `<span class="bc ${cls}">${c === '0' ? '•' : c.replace('Nb+', 'nb').replace('Wd', 'wd').replace('+', '')}</span>`; };
  function draw() {
    q('#sr-score').innerHTML = `${inn.runs}/${inn.wkts} <small>(${oversStr(inn.balls)}${inn.maxBalls % 6 === 0 ? ' / ' + inn.maxBalls / 6 : ''} ov)</small>`;
    q('#sr-rr').textContent = fmtRate(inn.runs, inn.balls);
    const ex = inn.extras; q('#sr-ex').textContent = ex.w + ex.nb + ex.b + ex.lb; q('#sr-bd').textContent = `${inn.f4} / ${inn.s6}`;
    if (inn.target) { q('#sr-kl').textContent = inn.done ? 'Result' : 'Need'; q('#sr-kv').textContent = inn.done ? (inn.runs >= inn.target ? 'Won' : 'Lost') : `${inn.target - inn.runs} (${inn.maxBalls - inn.balls}b)`; }
    else { q('#sr-kl').textContent = 'Balls left'; q('#sr-kv').textContent = inn.maxBalls - inn.balls; }
    const who = id => id ? `<span class="pill">${id === inn.striker ? '<span class="st">●</span>' : ''}<b>${esc(surname(inn.players[id].name))}</b> <span class="num">${inn.bat[id].r} (${inn.bat[id].b})</span></span>` : '';
    const bw = inn.cur || inn.lastOver;
    q('#sr-who').innerHTML = who(inn.striker) + who(inn.non) + (bw ? `<span class="pill">${esc(surname(inn.players[bw].name))} <span class="num">${oversFull(inn.bowlers[bw].balls)}-${inn.bowlers[bw].runs}-${inn.bowlers[bw].wkts}</span></span>` : '');
    q('#sr-over').innerHTML = (inn.cur ? inn.overBalls : (inn.overs.length ? inn.overs[inn.overs.length - 1].balls : [])).map(ballChip).join('');
    q('#sr-overs').innerHTML = inn.overs.map(o => `<span class="ob num ${o.runs >= 12 ? 'hot' : ''} ${o.balls.some(b => /W/.test(b) && b !== 'Wd') ? 'wk' : ''}" title="Over ${o.no}">${o.runs}</span>`).join('') || '<span class="muted" style="font-size:12px">No overs yet</span>';
    worm(); wagon();
  }
  function fit(cv) { const r = cv.getBoundingClientRect(), d = Math.min(2, devicePixelRatio || 1); cv.width = Math.max(10, r.width * d); cv.height = Math.max(10, r.height * d); const g = cv.getContext('2d'); g.setTransform(d, 0, 0, d, 0, 0); return [g, r.width, r.height]; }
  function worm() {
    const [g, w, h] = fit(q('#sr-worm')); const ovs = Math.max(1, Math.ceil(inn.maxBalls / 6)), pts = [0, ...inn.worm];
    if (inn.cur && inn.balls % 6) pts.push(inn.runs);
    const ymax = Math.max(20, inn.target || 0, inn.runs) * 1.1, L = 30, B = 18, xs = i => L + (w - L - 8) * i / ovs, ys = v => h - B - (h - B - 6) * v / ymax;
    g.font = '10px Barlow, sans-serif'; g.fillStyle = '#9cb0c9'; g.strokeStyle = 'rgba(243,247,244,.08)'; g.lineWidth = 1;
    const step = ymax > 300 ? 100 : ymax > 120 ? 50 : ymax > 50 ? 20 : 10;
    for (let v = 0; v <= ymax; v += step) { g.beginPath(); g.moveTo(L, ys(v)); g.lineTo(w - 8, ys(v)); g.stroke(); g.fillText(v, 4, ys(v) + 3); }
    const xstep = ovs > 20 ? 10 : ovs > 10 ? 5 : ovs > 5 ? 2 : 1;
    for (let o = 0; o <= ovs; o += xstep) g.fillText(o, xs(o) - 3, h - 4);
    if (inn.target) { g.setLineDash([4, 4]); g.strokeStyle = '#f5c518'; g.beginPath(); g.moveTo(L, ys(inn.target)); g.lineTo(w - 8, ys(inn.target)); g.stroke(); g.setLineDash([]); }
    const xAt = i => i < pts.length - 1 || !(inn.cur && inn.balls % 6) ? i : (inn.balls / 6);
    g.beginPath(); pts.forEach((v, i) => { const x = xs(xAt(i)), y = ys(v); i ? g.lineTo(x, y) : g.moveTo(x, y); });
    g.strokeStyle = '#22b363'; g.lineWidth = 2.4; g.stroke();
    g.lineTo(xs(xAt(pts.length - 1)), ys(0)); g.lineTo(xs(0), ys(0)); g.closePath(); g.fillStyle = 'rgba(34,179,99,.15)'; g.fill();
    inn.fow.forEach(f => { const ob = f.over.split('.'), x = xs(+ob[0] + (+ob[1] || 0) / 6), y = ys(f.runs); g.fillStyle = '#ef4f55'; g.beginPath(); g.arc(x, y, 3.5, 0, 7); g.fill(); });
    const lx = xs(xAt(pts.length - 1)), ly = ys(pts[pts.length - 1]); g.fillStyle = '#fff'; g.beginPath(); g.arc(lx, ly, 3.5, 0, 7); g.fill();
  }
  function wagon() {
    const [g, w, h] = fit(q('#sr-wag')); const R = Math.min(w, h) / 2 - 4, cx = w / 2, cy = h / 2;
    g.fillStyle = '#2f8a48'; g.beginPath(); g.arc(cx, cy, R, 0, 7); g.fill(); g.strokeStyle = 'rgba(255,255,255,.8)'; g.lineWidth = 1.2; g.stroke();
    g.setLineDash([2, 3]); g.strokeStyle = 'rgba(255,255,255,.45)'; g.beginPath(); g.arc(cx, cy, R * 0.45, 0, 7); g.stroke(); g.setLineDash([]);
    g.fillStyle = '#d2bd85'; g.fillRect(cx - 3, cy - R * 0.12, 6, R * 0.24);
    for (const s of shots) {
      const a = s.ang * Math.PI / 180, d = Math.min(s.dist, 1.05) * R, x = cx + Math.sin(a) * d, y = cy - Math.cos(a) * d;
      g.strokeStyle = s.runs === 6 ? '#f5c518' : s.runs === 4 ? '#ffffff' : 'rgba(191,232,204,.8)'; g.lineWidth = s.runs >= 4 ? 1.6 : 1;
      g.beginPath(); g.moveTo(cx, cy); g.lineTo(x, y); g.stroke();
    }
  }
  const shots = R.shots;
  function step() {
    const r = simBall(inn, ctx), ev = applyBall(inn, r);
    if (r.meta && r.kind !== 'wide' && !r.wicket && (r.runs > 0)) shots.push({ ang: r.meta.ang, dist: r.meta.dist, runs: r.runs });
    if (R.speed === 1 && !opts.silent) { if (ev.boundary === 6) Sound.cheer('six'); else if (ev.boundary === 4) Sound.cheer('four'); else if (ev.wicket) Sound.stumps(); }
    return ev;
  }
  function tick() {
    if (R.stopped || R.paused) return;
    if (inn.done) return end();
    const batch = R.speed >= 20 ? 6 : 1;
    for (let i = 0; i < batch && !inn.done; i++) step();
    draw();
    if (inn.done) return end();
    R.timer = setTimeout(tick, R.speed >= 20 ? 30 : R.speed >= 4 ? 140 : 520);
  }
  function end() { if (R.done) return; R.done = true; draw(); q('#sr-pp').disabled = true; q('#sr-skip').disabled = true; if (opts.onDone) opts.onDone(inn); }
  function setSpeed(s) { R.speed = s; root.querySelectorAll('#sr-spd button').forEach(b => b.classList.toggle('on', +b.dataset.sp === s)); }
  root.querySelector('#sr-spd').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { setSpeed(+b.dataset.sp); clearTimeout(R.timer); if (!R.paused) tick(); } });
  q('#sr-pp').addEventListener('click', () => { R.paused = !R.paused; q('#sr-pp').innerHTML = R.paused ? ICON.play : ICON.pause; if (!R.paused) tick(); });
  q('#sr-skip').addEventListener('click', () => { clearTimeout(R.timer); let g = 0; while (!inn.done && g++ < 6000) step(); end(); });
  setSpeed(R.speed); draw();
  R.timer = setTimeout(tick, 400);
  R.stop = () => { R.stopped = true; clearTimeout(R.timer); };
  return R;
}

    const next = f ? `<div class="card" style="display:flex;flex-direction:column;gap:12px"><div class="label" style="margin:0">Next · ${esc(f.label)}</div>
      <div class="vs"><div class="side">${badge(T(f.a), 'lg')}<b>${esc(T(f.a).name)}</b></div><div class="v">VS</div><div class="side">${badge(T(f.b), 'lg')}<b>${esc(T(f.b).name)}</b></div></div>
      ${mine ? `<button class="btn primary block playbtn" data-act="play">Play match</button>` : `<div class="trayrow"><button class="btn" data-act="simOne">Simulate match</button><button class="btn primary" data-act="simTo">${alive ? 'Sim to my match' : 'Sim to the end'}</button></div>`}</div>` : '';
    return `<div class="wrap">${topbar(t.name)}
      <div class="card row"><div class="grow"><b style="font-family:var(--f-display);font-size:20px;text-transform:uppercase">${esc(STAGE_LABEL[t.stage])} stage</b><div class="muted" style="font-size:13px">${t.teams.length} teams · ${t.overs} overs · ${DIFF[t.diff].label}</div></div>
      <span class="pill" style="font-size:13px;${alive ? 'color:var(--green)' : 'color:var(--red)'}">${alive ? 'Still in it' : 'Eliminated'}</span></div>
      ${next}
      <div class="tabs">${t.format === 'league' ? `<button class="${tabK === 'table' ? 'on' : ''}" data-act="tab" data-k="table">Points table</button>` : ''}<button class="${tabK === 'bracket' ? 'on' : ''}" data-act="tab" data-k="bracket">${t.format === 'league' ? 'Playoffs' : 'Bracket'}</button><button class="${tabK === 'fx' ? 'on' : ''}" data-act="tab" data-k="fx">Fixtures &amp; results</button></div>
      <div>${tabK === 'table' ? this.table(t) : tabK === 'bracket' ? this.bracket(t) : this.fixtures(t)}</div>
      <button class="btn ghost block" data-act="abandon">Abandon tournament</button></div>`;
  },
  table(t) {
    const st = standings(t), q = t.teams.length >= 5 ? 4 : 2;
    return `<div class="card" style="padding:6px 8px"><div style="overflow-x:auto"><table class="ptable"><thead><tr><th>#</th><th>Team</th><th>P</th><th>W</th><th>L</th><th>T</th><th>Pts</th><th>NRR</th></tr></thead><tbody>
      ${st.map((r, i) => { const tm = APP.team(r.id) || { short: r.id, color: '#555', name: r.id }; return `<tr class="${r.id === t.user ? 'me' : ''} ${i < q ? 'q' : ''}"><td>${i + 1}</td><td><span class="tn">${badge(tm, 'sm')}${esc(tm.name)}</span></td><td>${r.p}</td><td>${r.w}</td><td>${r.l}</td><td>${r.t}</td><td><b>${r.pts}</b></td><td>${r.nrr >= 0 ? '+' : ''}${r.nrr.toFixed(3)}</td></tr>`; }).join('')}
      </tbody></table></div><p class="help" style="margin:6px 4px">Top ${q} qualify (green). Ties on points are split by net run rate.</p></div>`;
  },
  bracket(t) {
    const T = id => APP.team(id) || { short: id, color: '#555' };
    const stages = ['qf', 'sf', 'final'].filter(s => t.fixtures.some(f => f.stage === s));
    if (!stages.length) return `<div class="card empty">Playoffs begin when the league stage ends.</div>`;
    return `<div class="bracket">${stages.map(s => `<div class="bcol"><div class="label" style="margin:0">${STAGE_LABEL[s]}</div>${t.fixtures.filter(f => f.stage === s).map(f => {
      const w = f.result && f.result.winnerId; const row = id => `<div class="${w ? (w === id ? 'w' : 'pend') : ''}">${badge(T(id), 'sm')}<span class="grow">${esc(T(id).short)}</span>${f.result ? `<span class="num" style="font-size:12px">${esc((f.result.inn.find(x => x.batId === id) || {}).runs ?? '')}</span>` : ''}</div>`;
      return `<div class="bm">${row(f.a)}${row(f.b)}</div>`; }).join('')}</div>`).join('')}</div>`;
  },
  fixtures(t) {
    const T = id => APP.team(id) || { short: id, color: '#555', name: id };
    return `<div class="list">${t.fixtures.map(f => { const w = f.result && f.result.winnerId, me = f.a === t.user || f.b === t.user;
      return `<div class="fx ${me ? 'me' : ''}"><div class="t ${w === f.a ? 'win' : ''}">${badge(T(f.a), 'sm')}<span>${esc(T(f.a).short)}</span></div><div class="c">${esc(f.label)}</div><div class="t r ${w === f.b ? 'win' : ''}"><span>${esc(T(f.b).short)}</span>${badge(T(f.b), 'sm')}</div>${f.result ? `<div class="rs">${esc(f.result.s1)} · ${esc(f.result.s2)} · ${esc(f.result.text)}</div>` : ''}</div>`; }).join('')}</div>`;
  },
  simFixture(t, f) {
    const A = APP.team(f.a), B = APP.team(f.b);
    const res = simMatch(A, B, t.overs, { pitch: fixturePitch(t), weather: pick(['sunny', 'sunny', 'overcast', 'night']) }, {});
    recordFixture(t, f, summarize(res.innings[0], res.innings[1], res.result));
  },
  on: { ...navOn,
    tab(d) { this.tab = d.k; APP.rerender(); },
    play() { const t = APP.state.tournament, f = nextFixture(t), opp = f.a === t.user ? f.b : f.a;
      Game.start({ user: t.user, opp, overs: t.overs, diff: t.diff, pitch: fixturePitch(t), weather: f.stage === 'final' ? 'night' : pick(['sunny', 'overcast', 'night']), oppMode: t.oppMode || 'bowl', tour: { fid: f.id } }); },
    simOne() { const t = APP.state.tournament, f = nextFixture(t); if (!f) return; this.simFixture(t, f); APP.save(); APP.toast(f.result.text); this.after(t); },
    simTo() {
      const t = APP.state.tournament; let n = 0, f;
      while ((f = nextFixture(t)) && !(f.a === t.user || f.b === t.user) && n++ < 200) this.simFixture(t, f);
      APP.save(); if (n) APP.toast(`${n} match${n === 1 ? '' : 'es'} simulated`); this.after(t);
    },
    async abandon() { if (await APP.confirm('Abandon tournament?', 'Progress in this tournament will be lost.', 'Abandon')) { APP.state.tournament = null; APP.save(); APP.go('home'); } }
  },
  after(t) { if (t.done) APP.go('tourWin'); else APP.rerender(); }
};
Screens.tourWin = {
  render() {
    const t = APP.state.tournament; if (!t) return `<div class="wrap">${topbar('Tournament')}<div class="empty">No tournament.</div></div>`;
    const w = APP.team(t.winner) || { name: t.winner, short: t.winner, color: '#555' }, me = t.winner === t.user;
    const fin = t.fixtures.find(f => f.stage === 'final');
    return `<div class="wrap"><div class="topbar"><h1>${esc(t.name)}</h1></div>
      <div class="res-hero" style="--wc:${esc(w.color)}"><div class="trophy">${TROPHY}</div>${badge(w, 'lg')}<h2>${me ? 'Champions!' : `${esc(w.name)} are champions`}</h2>
      ${fin && fin.result ? `<p>Final: ${esc(fin.result.s1)} · ${esc(fin.result.s2)}<br>${esc(fin.result.text)}</p>` : ''}</div>
      ${me ? '' : `<p class="help" style="margin:0;text-align:center">Your team ${userAlive(t) ? '' : 'fell short this time. '}Start another tournament to go again.</p>`}
      <div class="tabs"><button class="on" data-act="fx">All results</button></div>${Screens.tour.fixtures(t)}
      <button class="btn primary block" data-act="newT">New tournament</button><button class="btn ghost block" data-act="home">Home</button></div>`;
  },
  on: { fx() { }, newT() { APP.state.tournament = null; APP.save(); APP.go('tourSetup'); }, home() { APP.state.tournament = null; APP.save(); APP.go('home'); } },
  mount() { const t = APP.state.tournament; if (t && t.winner === t.user) { confetti(); Sound.cheer('win'); } }
};

// ---------- MATCH SIMULATOR ----------
const SIM_PRESETS = [['6b', 6, 'balls', '6 balls'], ['12b', 12, 'balls', '12 balls'], ['30b', 30, 'balls', '30 balls'], ['5o', 5, 'overs', '5 overs'], ['10o', 10, 'overs', '10 overs'], ['20o', 20, 'overs', '20 overs'], ['50o', 50, 'overs', '50 overs']];
Screens.sim = {
  render() {
    const s = APP.state.simSetup, b = APP.team(s.bat), w = APP.team(s.bowl);
    const cur = SIM_PRESETS.find(p => p[1] === +s.amount && p[2] === s.unit);
    return `<div class="wrap">${topbar('Match Simulator')}
      <div class="card vs"><div class="side">${badge(b, 'lg')}<b>${esc(b ? b.name : '-')}</b><span class="muted">Batting</span></div><button class="iconbtn" data-act="swap" aria-label="Swap teams" style="justify-self:center">⇄</button><div class="side">${badge(w, 'lg')}<b>${esc(w ? w.name : '-')}</b><span class="muted">Bowling</span></div></div>
      <div class="label">Batting team</div>${teamPicker('bat', s.bat, s.bowl)}
      <div class="label">Bowling team</div>${teamPicker('bowl', s.bowl, s.bat)}
      <div class="label">Length of innings</div><div class="chips">${SIM_PRESETS.map(p => `<button class="chip ${cur && cur[0] === p[0] ? 'on' : ''}" data-act="preset" data-a="${p[1]}" data-u="${p[2]}">${p[3]}</button>`).join('')}</div>
      <div class="row"><label class="field grow"><span>Custom amount</span><input type="number" id="sim-amt" min="1" max="${s.unit === 'balls' ? 300 : 50}" value="${s.amount}"></label><div class="field" style="width:150px"><span>Unit</span><div class="seg"><button data-act="unit" data-v="balls" class="${s.unit === 'balls' ? 'on' : ''}">Balls</button><button data-act="unit" data-v="overs" class="${s.unit === 'overs' ? 'on' : ''}">Overs</button></div></div></div>
      <label class="field"><span>Target to chase (optional)</span><input type="number" id="sim-tgt" min="1" max="999" placeholder="Leave empty for a first innings" value="${esc(s.target)}"></label>
      <div class="label">Difficulty for the batting side</div>${chips('diff', DIFFS, s.diff)}
      <div class="label">Pitch</div>${chips('pitch', PITCHES, s.pitch)}
      <div class="label">Conditions</div>${chips('weather', WEATHERS, s.weather)}
      <button class="btn primary block playbtn" data-act="run">Simulate innings</button></div>`;
  },
  on: { ...navOn,
    set(d) { const s = APP.state.simSetup; s[d.k] = d.v; if (s.bat === s.bowl) s.bowl = APP.playable().find(t => t.id !== s.bat).id; this.read(); APP.save(); APP.rerender(); },
    swap() { const s = APP.state.simSetup; [s.bat, s.bowl] = [s.bowl, s.bat]; this.read(); APP.save(); APP.rerender(); },
    preset(d) { const s = APP.state.simSetup; s.amount = +d.a; s.unit = d.u; this.read(true); APP.save(); APP.rerender(); },
    unit(d) { const s = APP.state.simSetup; this.read(); s.unit = d.v; if (d.v === 'overs' && s.amount > 50) s.amount = 50; APP.save(); APP.rerender(); },
    run() { this.read(); const s = APP.state.simSetup; const balls = s.unit === 'balls' ? s.amount : s.amount * 6; if (!(balls >= 1 && balls <= 300)) return APP.toast('Choose between 1 ball and 50 overs'); APP.save(); APP.go('simrun'); }
  },
  read(skipAmt) { const s = APP.state.simSetup, a = $('#sim-amt'), t = $('#sim-tgt'); if (a && !skipAmt) s.amount = Math.max(1, Math.min(s.unit === 'balls' ? 300 : 50, Math.round(+a.value || 1))); if (t) s.target = t.value ? String(Math.max(1, Math.round(+t.value))) : ''; }
};
Screens.simrun = {
  render() { return `<div class="wrap">${topbar('Simulation', 'sim')}<div id="runner"></div><div id="simend"></div></div>`; },
  mount(el) {
    const s = APP.state.simSetup, balls = s.unit === 'balls' ? s.amount : s.amount * 6;
    const D = { easy: { w: 0.8, b: 1.12, d: 0.03 }, medium: {}, hard: { w: 1.15, b: 0.92, d: -0.03 }, expert: { w: 1.3, b: 0.85, d: -0.05 } }[s.diff] || {};
    const inn = newInnings(APP.team(s.bat), APP.team(s.bowl), balls, { num: s.target ? 2 : 1, target: s.target ? +s.target : null, cond: { pitch: s.pitch, weather: s.weather } });
    this.inn = inn;
    const R = SimRunner($('#runner', el), inn, D, { speed: 1, onDone: () => {
      $('#simend', el).innerHTML = `<div style="display:flex;flex-direction:column;gap:12px;margin-top:4px">${inn.target ? `<div class="card" style="text-align:center"><b style="font-family:var(--f-display);font-size:24px;text-transform:uppercase;color:${inn.runs >= inn.target ? 'var(--green)' : 'var(--red)'}">${inn.runs >= inn.target ? `${esc(inn.batName)} chased it down` : `${esc(inn.batName)} fell ${inn.target - 1 - inn.runs === 0 ? 'level' : (inn.target - inn.runs) + ' short'}`}</b></div>` : ''}
        ${scorecardHTML(inn)}<div class="trayrow"><button class="btn primary" data-act="again">Run again</button><button class="btn" data-act="nav" data-to="sim">Change setup</button></div></div>`;
    } });
    return () => R.stop();
  },
  on: { ...navOn, again() { APP.go('simrun'); } }
};


// ===== BOOT =====
(function boot() {
  APP.load();
  document.addEventListener('pointerdown', () => Sound.unlock(), { passive: true });
  document.addEventListener('keydown', () => Sound.unlock());
  APP.go('home');
})();

</script>

</body>
</html>
